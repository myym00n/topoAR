name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (уже есть на runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Автотест — приложение открывается
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Текст ошибок автотеста
        if: failure()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  txt = (fl.get('message') or '') + ' | ' + (fl.text or '')[:1500]
                  print('::error title=' + tc.get('name') + '::' + txt.replace('\n', '%0A'))
          PY
          done

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TopoAR.apk

      - name: Сохранить APK в артефактах
        uses: actions/upload-artifact@v4
        with:
          name: TopoAR-apk
          path: TopoAR.apk

      - name: Выложить в релиз «latest» (прямая ссылка для телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ТопоAR — последняя сборка
          body: Сборка ${{ github.sha }}. Скачайте TopoAR.apk на телефон и установите.
          prerelease: false
          make_latest: true
          files: TopoAR.apk
